<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="/">
                <i class="bi bi-shield-lock me-1"></i> VÍ DỤ 3: THYMELEAF SECURITY
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="bi bi-house-door"></i> Trang chủ</a>
                    </li>
                    <!-- Menu chỉ hiển thị khi đã đăng nhập (USER hoặc ADMIN) -->
                    <li class="nav-item" sec:authorize="hasAnyRole('USER', 'ADMIN')">
                        <a class="nav-link" href="/user/dashboard"><i class="bi bi-speedometer2"></i> User Dashboard</a>
                    </li>
                    <!-- Menu chỉ hiển thị cho ADMIN -->
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link text-warning fw-semibold" href="/admin/dashboard"><i class="bi bi-shield-shaded"></i> Admin Dashboard</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center">
                    <!-- Khi là Guest (Chưa đăng nhập) -->
                    <div sec:authorize="isAnonymous()">
                        <a href="/login" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-in-right"></i> Đăng nhập</a>
                    </div>

                    <!-- Khi đã đăng nhập -->
                    <div sec:authorize="isAuthenticated()" class="d-flex align-items-center text-white">
                        <div class="me-3 text-end">
                            <div class="fw-bold small"><i class="bi bi-person-circle text-info me-1"></i><span sec:authentication="name"></span></div>
                            <span class="badge bg-primary" sec:authentication="principal.authorities"></span>
                        </div>
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-danger"><i class="bi bi-box-arrow-right"></i> Đăng xuất</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</body>
</html>
