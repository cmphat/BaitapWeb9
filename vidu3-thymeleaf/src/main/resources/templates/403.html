<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Truy cập bị từ chối</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-card { max-width: 520px; border-radius: 16px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
    </style>
</head>
<body>
    <div class="card error-card p-5 bg-white">
        <div class="text-danger mb-3">
            <i class="bi bi-shield-x" style="font-size: 5rem;"></i>
        </div>
        <h1 class="display-5 fw-bold text-danger">403</h1>
        <h4 class="fw-bold text-dark mb-2">Truy cập bị từ chối! (Access Denied)</h4>
        <p class="text-muted">
            Rất tiếc, tài khoản <strong sec:authorize="isAuthenticated()"><span sec:authentication="name"></span></strong>
            <span sec:authorize="isAnonymous()">của bạn</span> không có đủ thẩm quyền để truy cập vào tài nguyên này.
        </p>
        
        <div sec:authorize="isAuthenticated()" class="alert alert-secondary small py-2 mb-4">
            Quyền hiện tại của bạn: <strong sec:authentication="principal.authorities"></strong>
        </div>

        <div class="d-flex justify-content-center gap-2">
            <a href="/" class="btn btn-primary"><i class="bi bi-house"></i> Về trang chủ</a>
            <div sec:authorize="hasRole('USER')">
                <a href="/user/dashboard" class="btn btn-outline-primary"><i class="bi bi-speedometer2"></i> User Dashboard</a>
            </div>
            <div sec:authorize="isAnonymous()">
                <a href="/login" class="btn btn-outline-success"><i class="bi bi-box-arrow-in-right"></i> Đăng nhập bằng tài khoản khác</a>
            </div>
        </div>
    </div>
</body>
</html>
