<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Ví dụ 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; }
        .login-card { width: 100%; max-width: 440px; margin: auto; border-radius: 16px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="card login-card p-4 my-5 bg-white">
        <div class="text-center mb-4">
            <span class="badge bg-primary-subtle text-primary p-2 px-3 mb-2 rounded-pill fw-semibold">VÍ DỤ 3 - THYMELEAF</span>
            <h3 class="fw-bold text-dark">Đăng nhập tài khoản</h3>
            <p class="text-muted small">Kiểm tra hiển thị giao diện động theo vai trò</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
        </div>

        <div th:if="${logoutMessage}" class="alert alert-info py-2 small" role="alert">
            <i class="bi bi-info-circle-fill me-1"></i> <span th:text="${logoutMessage}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Tên đăng nhập hoặc Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="user hoặc admin" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="123456" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
            </button>
        </form>

        <div class="alert alert-light border mt-4 mb-0 small">
            <strong>Tài khoản demo:</strong>
            <ul class="mb-0 ps-3">
                <li><code>user</code> / <code>123456</code> (Quyền USER)</li>
                <li><code>admin</code> / <code>123456</code> (Quyền ADMIN)</li>
            </ul>
        </div>

        <div class="mt-3 text-center">
            <a href="/" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left"></i> Quay lại trang chủ</a>
        </div>
    </div>
</body>
</html>
