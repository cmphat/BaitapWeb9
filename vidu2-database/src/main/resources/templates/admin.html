<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khu vực quản trị - Ví dụ 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <a href="/" class="btn btn-outline-secondary btn-sm mb-3"><i class="bi bi-arrow-left"></i> Quay lại trang chủ</a>
        <div class="card p-4 border-0 shadow-sm border-danger">
            <h3 class="fw-bold text-danger"><i class="bi bi-shield-lock-fill me-2"></i>Khu vực Quản trị ADMIN (Ví dụ 2)</h3>
            <p class="text-muted">Chỉ tài khoản có quyền <code>ROLE_ADMIN</code> trong CSDL SQL Server mới được truy cập.</p>
            <div class="alert alert-success">
                Đăng nhập quản trị viên thành công: <strong sec:authentication="name"></strong>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-danger"><i class="bi bi-box-arrow-right"></i> Đăng xuất</button>
            </form>
        </div>
    </div>
</body>
</html>
