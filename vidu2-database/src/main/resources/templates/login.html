<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Ví dụ 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f1f5f9; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 420px; border-radius: 16px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="card login-card p-4 bg-white">
        <div class="text-center mb-4">
            <span class="badge bg-success-subtle text-success p-2 px-3 mb-2 rounded-pill fw-semibold">VÍ DỤ 2 - DATABASE</span>
            <h4 class="fw-bold text-dark">Đăng nhập hệ thống</h4>
            <p class="text-muted small">Xác thực tài khoản từ cơ sở dữ liệu SQL Server</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
        </div>

        <div th:if="${logoutMessage}" class="alert alert-info py-2 small" role="alert">
            <i class="bi bi-info-circle-fill me-1"></i> <span th:text="${logoutMessage}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Tên đăng nhập hoặc Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="user_db hoặc admin_db" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="123456" required>
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold"><i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập</button>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
            <a href="/" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left"></i> Quay lại trang chủ</a>
        </div>
    </div>
</body>
</html>
