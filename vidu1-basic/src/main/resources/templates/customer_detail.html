<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết khách hàng - Ví dụ 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <a href="/customer" class="btn btn-outline-secondary btn-sm mb-3"><i class="bi bi-arrow-left"></i> Quay lại danh sách khách hàng</a>
        
        <div class="card shadow-sm border-0" style="max-width: 600px; margin: 0 auto;">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0"><i class="bi bi-person-badge me-2"></i>Chi tiết khách hàng</h4>
                <small class="text-white-50">GET /customer/{id} (@PreAuthorize USER hoặc ADMIN)</small>
            </div>
            <div class="card-body p-4" th:if="${customer != null}">
                <ul class="list-group list-group-flush mb-3">
                    <li class="list-group-item d-flex justify-content-between">
                        <span class="text-muted">Mã khách hàng:</span>
                        <strong th:text="${customer.id}"></strong>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span class="text-muted">Họ và tên:</span>
                        <strong th:text="${customer.name}"></strong>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span class="text-muted">Email:</span>
                        <span th:text="${customer.email}"></span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span class="text-muted">Số điện thoại:</span>
                        <span th:text="${customer.phoneNumber}"></span>
                    </li>
                </ul>
                <div class="alert alert-success mb-0">
                    <i class="bi bi-shield-check me-2"></i> Xác thực thành công: Bạn đang xem với quyền <strong sec:authentication="principal.authorities"></strong>
                </div>
            </div>
            <div class="card-body p-4 text-center" th:unless="${customer != null}">
                <div class="alert alert-warning">Không tìm thấy khách hàng với mã: <strong th:text="${customerId}"></strong></div>
            </div>
        </div>
    </div>
</body>
</html>
