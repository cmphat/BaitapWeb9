<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit ? 'Chỉnh sửa Sản phẩm' : 'Đăng Sản phẩm mới'})}"></head>
<body class="bg-light">
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-4 p-lg-5 shadow-sm border-0">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="fw-bold text-primary mb-0">
                            <i class="bi bi-box-seam me-2"></i>
                            <span th:text="${isEdit ? 'Chỉnh sửa Sản phẩm' : 'Đăng Sản phẩm mới'}"></span>
                        </h4>
                        <a href="/products" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Quay lại</a>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="${isEdit ? '/products/edit/' + productDTO.id : '/products/new'}" 
                          th:object="${productDTO}" method="post" enctype="multipart/form-data">
                        
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Tên sản phẩm <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="Ví dụ: Laptop Dell XPS 15" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Giá sản phẩm (VNĐ) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">₫</span>
                                <input type="number" step="1000" min="0" th:field="*{price}" class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''" placeholder="25000000" required>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Mô tả sản phẩm</label>
                            <textarea th:field="*{description}" class="form-control" rows="4" placeholder="Nhập thông tin chi tiết, đặc điểm cấu hình, tình trạng của sản phẩm..."></textarea>
                        </div>

                        <!-- Upload hình ảnh (Cloudinary / Local) -->
                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Hình ảnh sản phẩm (Cloudinary Upload)</label>
                            <input type="file" name="image" class="form-control" accept="image/*">
                            <div class="form-text small">Hỗ trợ các định dạng: JPG, JPEG, PNG, WEBP, GIF (Dưới 10MB).</div>
                            
                            <!-- Xem trước ảnh hiện tại nếu đang sửa -->
                            <div th:if="${isEdit && productDTO.imageUrl != null && !productDTO.imageUrl.isEmpty()}" class="mt-3">
                                <span class="small text-muted d-block mb-1">Ảnh hiện tại:</span>
                                <img th:src="${productDTO.imageUrl}" class="rounded border" style="max-height: 120px;" alt="Current Image">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a href="/products" class="btn btn-secondary">Hủy bỏ</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-cloud-arrow-up me-1"></i>
                                <span th:text="${isEdit ? 'Lưu cập nhật' : 'Đăng sản phẩm'}"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
