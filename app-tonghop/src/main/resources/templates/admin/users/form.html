<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit ? 'Chỉnh sửa Người dùng' : 'Thêm Người dùng mới'})}"></head>
<body class="bg-light">
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card p-4 shadow-sm border-0">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="fw-bold text-primary mb-0">
                            <i class="bi bi-person-gear me-2"></i>
                            <span th:text="${isEdit ? 'Chỉnh sửa thông tin Người dùng' : 'Thêm Người dùng mới'}"></span>
                        </h4>
                        <a href="/admin/users" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Quay lại danh sách</a>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="${isEdit ? '/admin/users/edit/' + userDTO.id : '/admin/users/new'}" th:object="${userDTO}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Tên đăng nhập (Username)</label>
                            <input type="text" th:field="*{username}" class="form-control" th:readonly="${isEdit}" required>
                            <div class="form-text small" th:if="${isEdit}">Tên đăng nhập không thể thay đổi sau khi tạo.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Địa chỉ Email</label>
                            <input type="email" th:field="*{email}" class="form-control" required>
                        </div>

                        <div class="mb-3" th:if="${!isEdit}">
                            <label class="form-label small fw-semibold">Mật khẩu khởi tạo</label>
                            <input type="password" name="password" class="form-control" placeholder="Mặc định: 123456">
                            <div class="form-text small">Nếu để trống, mật khẩu mặc định là <code>123456</code>.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Vai trò (Role)</label>
                            <select th:field="*{roleName}" class="form-select">
                                <option value="ROLE_USER">ROLE_USER (Người dùng thông thường)</option>
                                <option value="ROLE_ADMIN">ROLE_ADMIN (Quản trị viên toàn quyền)</option>
                            </select>
                        </div>

                        <div class="mb-4 form-check form-switch">
                            <input class="form-check-input" type="checkbox" th:field="*{enabled}" id="enabledSwitch">
                            <label class="form-check-label fw-semibold" for="enabledSwitch">Kích hoạt tài khoản (Được phép đăng nhập)</label>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="/admin/users" class="btn btn-secondary">Hủy bỏ</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-save me-1"></i> Lưu thông tin
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
