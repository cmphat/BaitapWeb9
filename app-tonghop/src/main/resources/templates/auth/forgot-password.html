<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quên mật khẩu - Bài tập Web 9')}"></head>
<body style="background-color: #f1f5f9;">
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="d-flex align-items-center justify-content-center py-5">
        <div class="card p-4 shadow" style="width: 100%; max-width: 440px; border-radius: 16px;">
            <div class="text-center mb-4">
                <div class="d-inline-flex p-3 bg-danger-subtle text-danger rounded-circle mb-2">
                    <i class="bi bi-question-circle-fill fs-3"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Quên mật khẩu</h3>
                <p class="text-muted small">Nhập email tài khoản của bạn để nhận mã OTP xác thực</p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
            </div>
            <div th:if="${infoMessage}" class="alert alert-info py-2 small" role="alert">
                <i class="bi bi-info-circle-fill me-1"></i> <span th:text="${infoMessage}"></span>
            </div>

            <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Địa chỉ Email đăng ký</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="example@gmail.com" required autofocus>
                    </div>
                </div>

                <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold mb-3">
                    <i class="bi bi-send me-1"></i> Gửi mã OTP xác nhận
                </button>
            </form>

            <div class="text-center pt-3 border-top">
                <a href="/login" class="small text-muted text-decoration-none"><i class="bi bi-arrow-left"></i> Quay lại đăng nhập</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
