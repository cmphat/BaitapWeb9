<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Xác thực OTP - Bài tập Web 9')}"></head>
<body style="background-color: #f1f5f9;">
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="d-flex align-items-center justify-content-center py-5">
        <div class="card p-4 shadow" style="width: 100%; max-width: 440px; border-radius: 16px;">
            <div class="text-center mb-4">
                <div class="d-inline-flex p-3 bg-warning-subtle text-warning-emphasis rounded-circle mb-2">
                    <i class="bi bi-patch-check-fill fs-3"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Xác thực mã OTP</h3>
                <p class="text-muted small">Nhập mã gồm 6 chữ số đã được gửi tới email</p>
            </div>

            <div th:if="${infoMessage}" class="alert alert-info py-2 small" role="alert">
                <i class="bi bi-info-circle-fill me-1"></i> <span th:text="${infoMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Địa chỉ Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="email@gmail.com" required readonly>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Mã OTP (6 chữ số)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                        <input type="text" th:field="*{otp}" maxlength="6" class="form-control form-control-lg text-center fw-bold letter-spacing-lg" placeholder="••••••" autofocus required>
                    </div>
                    <div class="form-text small text-muted">Mã OTP có giá trị trong 5 phút và tối đa 5 lần nhập sai.</div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                    <i class="bi bi-check2-circle me-1"></i> Xác nhận kích hoạt
                </button>
            </form>

            <form th:action="@{/resend-register-otp}" method="post" class="text-center">
                <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
                <button type="submit" class="btn btn-link text-decoration-none small text-secondary">
                    <i class="bi bi-arrow-clockwise"></i> Chưa nhận được mã? Gửi lại OTP
                </button>
            </form>

            <div class="text-center pt-3 border-top mt-2">
                <a href="/login" class="small text-muted text-decoration-none"><i class="bi bi-arrow-left"></i> Quay lại đăng nhập</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
