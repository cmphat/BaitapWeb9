<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đặt lại mật khẩu - Bài tập Web 9')}"></head>
<body style="background-color: #f1f5f9;">
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="d-flex align-items-center justify-content-center py-5">
        <div class="card p-4 shadow" style="width: 100%; max-width: 460px; border-radius: 16px;">
            <div class="text-center mb-4">
                <div class="d-inline-flex p-3 bg-danger-subtle text-danger rounded-circle mb-2">
                    <i class="bi bi-key-fill fs-3"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Đặt lại mật khẩu</h3>
                <p class="text-muted small">Nhập mã OTP và mật khẩu mới cho tài khoản</p>
            </div>

            <div th:if="${infoMessage}" class="alert alert-info py-2 small" role="alert">
                <i class="bi bi-info-circle-fill me-1"></i> <span th:text="${infoMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Địa chỉ Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="email@gmail.com" required readonly>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Mã OTP (6 chữ số)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-patch-check"></i></span>
                        <input type="text" th:field="*{otp}" maxlength="6" class="form-control text-center fw-bold letter-spacing-lg" placeholder="••••••" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Mật khẩu mới (Tối thiểu 6 ký tự)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" th:field="*{newPassword}" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Xác nhận lại mật khẩu mới</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                        <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold mb-3">
                    <i class="bi bi-check-lg me-1"></i> Lưu mật khẩu mới
                </button>
            </form>

            <form th:action="@{/resend-reset-otp}" method="post" class="text-center">
                <input type="hidden" name="email" th:value="${resetPasswordDTO.email}">
                <button type="submit" class="btn btn-link text-decoration-none small text-secondary">
                    <i class="bi bi-arrow-clockwise"></i> Gửi lại mã OTP
                </button>
            </form>

            <div class="text-center pt-3 border-top mt-2">
                <a href="/login" class="small text-muted text-decoration-none"><i class="bi bi-arrow-left"></i> Quay lại đăng nhập</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
